name: iOS Certificate Pool Sign & Publish

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Optional direct HTTPS URL to an unsigned IPA
        required: false
        type: string
  workflow_run:
    workflows: ["Build Unsigned iOS IPA"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ios-cert-pool-publish
  cancel-in-progress: true

jobs:
  sign:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p build/input
          if [[ -n "${INPUT_IPA_URL:-}" ]]; then
            curl -fL --retry 3 "$INPUT_IPA_URL" -o build/input/app.ipa
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            gh run download "$run_id" --repo "${{ github.repository }}" --dir build/download
            ipa=$(find build/download -type f -name '*-unsigned.ipa' | head -1)
            [[ -n "$ipa" && -f "$ipa" ]]
            cp "$ipa" build/input/app.ipa
          else
            echo 'Provide ipa_url or run after unsigned workflow.' >&2
            exit 2
          fi

      - name: Fetch and prepare certificate pool
        run: |
          set -euo pipefail
          bash scripts/signing/fetch-certs.sh
          bash scripts/signing/prepare-certs.sh
          test -s build/cert-pool/cert-index.tsv

      - name: Install zsign
        run: brew install zsign

      - name: Sign IPA with each usable certificate
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          repo_name="${REPO#*/}"
          pages_base="https://${owner}.github.io/${repo_name}/install"
          release_tag="ios-cert-pool-latest"
          mkdir -p build/signed build/release docs/install/manifests
          rm -rf docs/install/manifests
          mkdir -p docs/install/manifests
          ok=0
          fail=0

          while IFS=$'\t' read -r dir name expires appid; do
            [[ -d "$dir" ]] || continue
            [[ -f "$dir/cert.p12" && -f "$dir/profile.mobileprovision" ]] || { fail=$((fail+1)); continue; }
            pass=""
            [[ -f "$dir/password.txt" ]] && pass=$(cat "$dir/password.txt")
            slug=$(basename "$dir")
            out="build/signed/$slug"
            mkdir -p "$out"

            if zsign -k "$dir/cert.p12" -p "$pass" -m "$dir/profile.mobileprovision" -o "$out/app.ipa" build/input/app.ipa; then
              asset="GPT-Image-Playground-${slug}.ipa"
              cp "$out/app.ipa" "build/release/$asset"
              unzip -p "$out/app.ipa" 'Payload/*.app/Info.plist' > "$out/Info.plist"
              bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$out/Info.plist" 2>/dev/null || echo unknown)
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$out/Info.plist" 2>/dev/null || echo 1)
              title=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$out/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$out/Info.plist" 2>/dev/null || echo 'GPT Image Playground')
              ipa_url="https://github.com/$REPO/releases/download/$release_tag/$asset"
              manifest_url="$pages_base/manifests/$slug.plist"

              IPA_URL="$ipa_url" MANIFEST_PATH="docs/install/manifests/$slug.plist" \
              BUNDLE="$bundle" VERSION="$version" TITLE="$title" python3 - <<'PY'
          import os, plistlib
          payload = {
              'items': [{
                  'assets': [{'kind': 'software-package', 'url': os.environ['IPA_URL']}],
                  'metadata': {
                      'bundle-identifier': os.environ['BUNDLE'],
                      'bundle-version': os.environ['VERSION'],
                      'kind': 'software',
                      'title': os.environ['TITLE'],
                  },
              }]
          }
          with open(os.environ['MANIFEST_PATH'], 'wb') as f:
              plistlib.dump(payload, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

              python3 - "$name" "$expires" "$manifest_url" "$bundle" "$version" "$out/metadata.json" <<'PY'
          import json, sys
          json.dump({
              'name': sys.argv[1],
              'expires': sys.argv[2],
              'manifest_url': sys.argv[3],
              'bundle_id': sys.argv[4],
              'bundle_version': sys.argv[5],
          }, open(sys.argv[6], 'w'))
          PY
              ok=$((ok+1))
            else
              fail=$((fail+1))
            fi
          done < build/cert-pool/cert-index.tsv

          echo "SIGNED_OK=$ok" >> "$GITHUB_ENV"
          echo "SIGNED_FAILED=$fail" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PAGES_INSTALL_URL=$pages_base/" >> "$GITHUB_ENV"
          test "$ok" -gt 0

      - name: Publish signed IPA files to rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<EOF
          Automated public certificate-pool signing output.

          - Signed successfully: $SIGNED_OK
          - Failed/skipped: $SIGNED_FAILED
          - Source workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Public enterprise certificates may be revoked by Apple at any time.
          EOF

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --title "iOS Certificate Pool — Latest" --notes-file build/release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --title "iOS Certificate Pool — Latest" --notes-file build/release-notes.md --prerelease \
              --target main
          fi
          gh release upload "$RELEASE_TAG" build/release/*.ipa --repo "${{ github.repository }}" --clobber

      - name: Generate install page
        run: python3 scripts/signing/generate-install-page.py

      - name: Publish install manifests and page
        run: |
          set -euo pipefail
          rm -rf docs/install/ipa
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/install
          git commit -m "chore(ios): publish $SIGNED_OK certificate-pool install options [skip ios]" || exit 0
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "### iOS certificate-pool signing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed: $SIGNED_OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed/skipped: $SIGNED_FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "- IPA storage: GitHub Release $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install page: $PAGES_INSTALL_URL" >> "$GITHUB_STEP_SUMMARY"
