name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS Certificate Pool Sign & Publish"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_DEFAULT_API_URL: ${{ secrets.VITE_DEFAULT_API_URL }}
          VITE_LOCK_PRESET_CONFIG_PARAMS: 'false'
          VITE_PREVENT_PRESET_CONFIG_DELETION: 'false'

      - name: Add iOS install portal to Pages bundle
        run: |
          set -euo pipefail
          if [[ -d docs/install ]]; then
            rm -rf dist/install
            mkdir -p dist/install
            cp -R docs/install/. dist/install/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
