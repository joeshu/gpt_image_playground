name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, ios-mobile, feat/ios-cert-pool-install]
    tags: ['v*']

permissions:
  contents: write

# Keep every prompt-feature change behind the same full unsigned IPA gate.
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Build production web app
        run: npm run build

      - name: Verify mobile layout contract
        run: |
          set -euo pipefail
          node scripts/check-mobile-surface-layout.mjs
          node scripts/check-agent-mobile-interaction.mjs
          grep -Fq "padding-bottom: calc(0.375rem + var(--safe-area-bottom))" src/index.css
          grep -Fq "flex: 1 1 0%" src/index.css
          grep -Fq "[data-detail-actions]" src/index.css
          grep -Fq "@media (hover: none) and (pointer: coarse)" src/index.css
          grep -Fq "mobile-composer-collapsed" src/components/InputBar.tsx
          grep -Fq "bottom-[calc(var(--input-bar-clearance,12rem)+0.75rem)] right-4" src/components/AgentWorkspace.tsx

      - name: Generate and sync Capacitor iOS project
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Configure native iOS project
        run: bash scripts/configure-ios.sh

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/ios-derived-data \
            CONFIGURATION_BUILD_DIR="$PWD/build/ios-app" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/xcodebuild.log

      - name: Package artifacts and build report
        run: |
          set -euo pipefail
          test -d build/ios-app/App.app
          mkdir -p build/Payload build/report
          cp -R build/ios-app/App.app build/Payload/App.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/GPT-Image-Playground-${{ github.run_number }}-unsigned.ipa
          ditto -c -k --sequesterRsrc --keepParent build/ios-app/App.app build/GPT-Image-Playground-${{ github.run_number }}-unsigned.app.zip
          cat > build/report/build-info.json <<EOF
          {
            "variant": "unsigned",
            "version": "${{ github.ref_name }}",
            "runNumber": "${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "xcode": "$(xcodebuild -version | tr '\n' ' ')",
            "builtAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: gpt-image-playground-ios-unsigned-${{ github.run_number }}
          path: |
            build/*.ipa
            build/*.app.zip
            build/report/build-info.json
            build/xcodebuild.log
          if-no-files-found: error
          retention-days: 30

      # Temporary end-to-end certificate-pool validation on the feature branch.
      # This does not publish or commit generated IPA files, so it cannot create a push loop.
      - name: Fetch and prepare public certificate pool
        if: github.ref_name == 'feat/ios-cert-pool-install'
        run: |
          set -euo pipefail
          bash scripts/signing/fetch-certs.sh
          bash scripts/signing/prepare-certs.sh
          test -s build/cert-pool/cert-index.tsv

      - name: Install zsign for certificate-pool test
        if: github.ref_name == 'feat/ios-cert-pool-install'
        run: brew install zsign

      - name: Sign unsigned IPA with usable certificates
        if: github.ref_name == 'feat/ios-cert-pool-install'
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          input_ipa="build/GPT-Image-Playground-${{ github.run_number }}-unsigned.ipa"
          test -f "$input_ipa"
          mkdir -p build/signed build/install/ipa build/install/manifests
          ok=0
          fail=0

          while IFS=$'\t' read -r dir name expires appid; do
            [[ -d "$dir" ]] || continue
            [[ -f "$dir/cert.p12" && -f "$dir/profile.mobileprovision" ]] || { fail=$((fail+1)); continue; }
            pass=""
            [[ -f "$dir/password.txt" ]] && pass=$(cat "$dir/password.txt")
            slug=$(basename "$dir")
            out="build/signed/$slug"
            mkdir -p "$out"

            if zsign -k "$dir/cert.p12" -p "$pass" -m "$dir/profile.mobileprovision" -o "$out/app.ipa" "$input_ipa"; then
              cp "$out/app.ipa" "build/install/ipa/$slug.ipa"
              unzip -p "$out/app.ipa" 'Payload/*.app/Info.plist' > "$out/Info.plist"
              bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$out/Info.plist" 2>/dev/null || echo unknown)
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$out/Info.plist" 2>/dev/null || echo 1)
              title=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$out/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$out/Info.plist" 2>/dev/null || echo 'GPT Image Playground')

              IPA_URL="https://raw.githubusercontent.com/$REPO/$BRANCH/build/install/ipa/$slug.ipa" \
              MANIFEST_PATH="build/install/manifests/$slug.plist" \
              BUNDLE="$bundle" VERSION="$version" TITLE="$title" \
              python3 - <<'PY'
          import os, plistlib
          payload = {
              'items': [{
                  'assets': [{'kind': 'software-package', 'url': os.environ['IPA_URL']}],
                  'metadata': {
                      'bundle-identifier': os.environ['BUNDLE'],
                      'bundle-version': os.environ['VERSION'],
                      'kind': 'software',
                      'title': os.environ['TITLE'],
                  },
              }]
          }
          with open(os.environ['MANIFEST_PATH'], 'wb') as f:
              plistlib.dump(payload, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

              python3 - "$name" "$expires" "$bundle" "$version" "$out/metadata.json" <<'PY'
          import json, sys
          json.dump({
              'name': sys.argv[1],
              'expires': sys.argv[2],
              'bundle_id': sys.argv[3],
              'bundle_version': sys.argv[4],
          }, open(sys.argv[5], 'w'))
          PY
              ok=$((ok+1))
            else
              fail=$((fail+1))
            fi
          done < build/cert-pool/cert-index.tsv

          echo "CERT_POOL_SIGNED_OK=$ok" >> "$GITHUB_ENV"
          echo "CERT_POOL_SIGNED_FAILED=$fail" >> "$GITHUB_ENV"
          echo "### Certificate-pool test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed successfully: $ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed/skipped: $fail" >> "$GITHUB_STEP_SUMMARY"
          test "$ok" -gt 0

      - name: Upload certificate-pool test result
        if: github.ref_name == 'feat/ios-cert-pool-install' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-image-playground-cert-pool-test-${{ github.run_number }}
          path: |
            build/cert-pool/cert-index.tsv
            build/signed/*/metadata.json
            build/install/ipa/*.ipa
            build/install/manifests/*.plist
          if-no-files-found: warn
          retention-days: 7

      - name: Publish tagged Unsigned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IPA_PATH="build/GPT-Image-Playground-${{ github.run_number }}-unsigned.ipa"
          APP_ZIP_PATH="build/GPT-Image-Playground-${{ github.run_number }}-unsigned.app.zip"
          REPORT_PATH="build/report/build-info.json"
          cat > build/release-notes.md <<EOF
          # GPT Image Playground $RELEASE_TAG — Unsigned IPA

          - Commit: ${{ github.sha }}
          - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Variant: Unsigned iOS IPA
          - The IPA is unsigned and intended for supported sideloading or later re-signing environments.
          EOF

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "GPT Image Playground $RELEASE_TAG — Unsigned IPA" \
              --notes-file build/release-notes.md
            gh release upload "$RELEASE_TAG" \
              "$IPA_PATH" "$APP_ZIP_PATH" "$REPORT_PATH" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$IPA_PATH" "$APP_ZIP_PATH" "$REPORT_PATH" \
              --repo "${{ github.repository }}" \
              --title "GPT Image Playground $RELEASE_TAG — Unsigned IPA" \
              --notes-file build/release-notes.md \
              --verify-tag
          fi
